<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Import in Progress</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: 0 auto; text-align: center; }
        .progress-bar { width: 100%; height: 24px; background: #e9ecef; border-radius: 12px; overflow: hidden; margin: 24px 0; }
        .progress-fill { height: 100%; background: #007bff; width: 0%; transition: width 0.3s; border-radius: 12px; }
        .progress-fill.scanning { background: linear-gradient(90deg, #007bff, #66b0ff, #007bff); background-size: 200% 100%; animation: slide 1.5s linear infinite; }
        @keyframes slide { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
        .status { margin: 16px 0; color: #666; }
        .movie-name { font-size: 18px; margin: 8px 0; }
        .counter { font-size: 14px; color: #999; }
        .elapsed { font-size: 14px; color: #999; margin-top: 8px; }
        .recent { margin-top: 24px; text-align: left; border-top: 1px solid #ddd; padding-top: 8px; }
        .recent-title { font-size: 13px; color: #999; margin-bottom: 4px; }
        #recent-list { max-height: 160px; overflow-y: auto; }
        .recent-row { font-size: 13px; color: #555; padding: 3px 0; border-bottom: 1px dotted #eee; }
        .recent-name { margin-right: 8px; }
        .recent-status { color: #007bff; }
        .log { margin-top: 24px; text-align: left; border-top: 1px solid #ddd; padding-top: 8px; }
        .log-title { font-size: 13px; color: #999; margin-bottom: 4px; }
        .log-window { max-height: 200px; overflow-y: auto; background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px; color: #333; }
        .log-line { white-space: pre-wrap; word-break: break-all; line-height: 1.4; }
    </style>
</head>
<body>
<div class="container">
    <h1>Импорт оценок...</h1>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="status" id="status-text">Начинаю...</div>
    <div class="movie-name" id="movie-name"></div>
    <div class="counter" id="counter"></div>
    <div class="elapsed" id="elapsed"></div>

    <div class="recent" id="recent" style="display: none;">
        <div class="recent-title">Последние обработанные:</div>
        <div id="recent-list"></div>
    </div>

    <button id="pause-btn" onclick="pauseImport()" style="margin-top: 24px; padding: 10px 24px; font-size: 16px; cursor: pointer; background: #ffc107; color: white; border: none; border-radius: 6px;">Пауза</button>
    <button id="stop-btn" onclick="stopImport()" style="margin-top: 24px; padding: 10px 24px; font-size: 16px; cursor: pointer; background: #dc3545; color: white; border: none; border-radius: 6px;">Прекратить</button>
    <button id="resume-btn" onclick="resumeImport()" style="display: none; margin-top: 24px; padding: 10px 24px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 6px;">Продолжить</button>

    <div class="log">
        <div class="log-title">Лог:</div>
        <div class="log-window" id="log-window"></div>
    </div>
</div>

<script>
    var startTime = Date.now();
    var source = new EventSource('/notes/progress');
    var currentMovie = null;
    var logSource = new EventSource('/notes/log');

    logSource.onmessage = function(event) {
        var win = document.getElementById('log-window');
        var line = document.createElement('div');
        line.className = 'log-line';
        line.textContent = event.data;
        win.appendChild(line);
        while (win.children.length > 1000) {
            win.removeChild(win.firstChild);
        }
        win.scrollTop = win.scrollHeight;
    };

    logSource.onerror = function() {
        logSource.close();
    };

    source.onmessage = function(event) {
        var data = JSON.parse(event.data);

        if (data.finished) {
            source.close();
            if (data.result && data.result.errorMessage) {
                window.location.href = '/notes/error?message=' + encodeURIComponent(data.result.errorMessage);
            } else {
                window.location.href = '/notes/result';
            }
            return;
        }

        if (data.paused) {
            document.getElementById('resume-btn').style.display = 'inline-block';
            document.getElementById('pause-btn').style.display = 'none';
            document.getElementById('stop-btn').disabled = false;
            if (data.status === 'paused-still-busy') {
                document.getElementById('status-text').textContent = 'File is still busy: close it and click Continue';
            } else if (data.status === 'paused-user') {
                document.getElementById('status-text').textContent = 'Paused. Click Continue to resume.';
            } else {
                document.getElementById('status-text').textContent = 'Paused: close the CSV file and click Continue';
            }
            return;
        }

        if (data.status === 'resumed') {
            document.getElementById('resume-btn').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'inline-block';
            document.getElementById('pause-btn').disabled = false;
            document.getElementById('stop-btn').disabled = false;
            document.getElementById('status-text').textContent = 'Resuming...';
            return;
        }

        var pct;
        var statusText;
        var fill = document.getElementById('progress-fill');
        if (data.phase === 'kp') {
            pct = 0;
            document.getElementById('counter').textContent = 'Scanning...';
            fill.classList.add('scanning');
            if (data.status === 'api') {
                statusText = data.movieName || 'Parsing Kinopoisk ratings...';
                document.getElementById('movie-name').textContent = '';
            } else {
                statusText = 'Parsing Kinopoisk ratings...';
                document.getElementById('movie-name').textContent = data.movieName || '';
            }
        } else {
            if (currentMovie) {
                addProcessed(currentMovie);
            }
            currentMovie = { name: data.movieName, status: data.status };
            pct = data.total > 0 ? Math.round(data.current / data.total * 100) : 0;
            statusText = getStatusText(data.status);
            document.getElementById('movie-name').textContent = data.movieName || '';
            document.getElementById('counter').textContent = data.current + ' / ' + data.total;
            fill.classList.remove('scanning');
        }
        fill.style.width = pct + '%';
        document.getElementById('status-text').textContent = statusText;

        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var mins = Math.floor(elapsed / 60);
        var secs = elapsed % 60;
        document.getElementById('elapsed').textContent = 'Elapsed: ' + mins + 'm ' + secs + 's';
    };

    source.onerror = function() {
        source.close();
        document.getElementById('status-text').textContent = 'Connection lost. Redirecting...';
        setTimeout(function() { window.location.href = '/notes/result'; }, 2000);
    };

    function stopImport() {
        fetch('/notes/stop', { method: 'POST' });
        document.getElementById('status-text').textContent = 'Stopping...';
        document.getElementById('stop-btn').disabled = true;
        document.getElementById('pause-btn').disabled = true;
    }

    function pauseImport() {
        fetch('/notes/pause', { method: 'POST' });
        document.getElementById('status-text').textContent = 'Pausing after the current movie...';
        document.getElementById('pause-btn').disabled = true;
    }

    function resumeImport() {
        fetch('/notes/resume', { method: 'POST' });
        document.getElementById('resume-btn').disabled = true;
        document.getElementById('status-text').textContent = 'Resuming...';
    }

    function getStatusText(s) {
        var map = {
            'RATED': 'Rated',
            'NOT_FOUND': 'Not found on IMDB',
            'SKIPPED_SAME': 'Skipped (same rating)',
            'SKIPPED_DIFFERENT': 'Skipped (different rating)',
            'ERROR': 'Error',
            'complete': 'Completed'
        };
        return map[s] || s;
    }

    function addProcessed(m) {
        var list = document.getElementById('recent');
        list.style.display = 'block';
        var rowsBox = document.getElementById('recent-list');
        var row = document.createElement('div');
        row.className = 'recent-row';
        var name = document.createElement('span');
        name.className = 'recent-name';
        name.textContent = m.name;
        var st = document.createElement('span');
        st.className = 'recent-status';
        st.textContent = getStatusText(m.status);
        row.appendChild(name);
        row.appendChild(st);
        rowsBox.appendChild(row);
        rowsBox.scrollTop = rowsBox.scrollHeight;
        var rows = rowsBox.querySelectorAll('.recent-row');
        while (rows.length > 20) {
            rowsBox.removeChild(rows[0]);
            rows = rowsBox.querySelectorAll('.recent-row');
        }
    }
</script>
</body>
</html>
