<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: common-head('Парсинг в процессе')}"></th:block>
    <style>
        .container { max-width: 600px; text-align: center; }
        .notice { margin: 16px 0; }
    </style>
</head>
<body data-result-url="/notes/parsing-result" data-pause-message="Пауза после текущего шага..."
      th:attr="data-back-url=@{/method-form(parserType=${parserType})}">
<div class="container">
    <h1>Парсинг оценок с Кинопоиска...</h1>

    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="status" id="status-text">Начинаю...</div>
    <div class="movie-name" id="movie-name"></div>
    <div class="counter" id="counter"></div>
    <div class="elapsed" id="elapsed"></div>

    <div class="notice">
        <strong>Важно:</strong> не открывайте и не редактируйте файл дампа <code>kp-ratings-*.csv</code> вручную, пока идёт парсинг.
    </div>

    <th:block th:replace="~{fragments/importing :: controls}"></th:block>

    <div class="log">
        <div class="log-title">Лог:</div>
        <div class="log-window" id="log-window"></div>
    </div>
</div>

<script th:src="@{/import.js}"></script>
<script>
    initImportPage(function (data) {
        var pct;
        var fill = document.getElementById('progress-fill');
        if (data.total > 0) {
            // Детерминированный прогресс: total известен (selenium со счётчиком оценок / api).
            pct = Math.round(data.current / data.total * 100);
            if (pct > 100) { pct = 100; }
            fill.classList.remove('scanning');
            document.getElementById('counter').textContent = data.current + ' / ' + data.total;
            document.getElementById('movie-name').textContent = data.movieName || '';
            document.getElementById('status-text').textContent = data.phase === 'kp'
                ? 'Парсинг оценок Кинопоиска...'
                : 'Обработка...';
        } else {
            // Индетерминированный прогресс (total неизвестен, напр. selenium без счётчика):
            // полоса на всю ширину с анимированным градиентом, чтобы бар визуально двигался.
            pct = 100;
            fill.classList.add('scanning');
            document.getElementById('counter').textContent = 'Сканирование...';
            document.getElementById('movie-name').textContent = data.movieName || '';
            document.getElementById('status-text').textContent = 'Парсинг оценок Кинопоиска...';
        }
        fill.style.width = pct + '%';
    });
</script>
</body>
</html>
