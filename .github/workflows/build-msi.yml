name: Build MSI & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update GitHub Releases and upload assets

jobs:
  build-msi:
    name: Build .msi on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # caches ~/.m2 so JavaFX win-jars persist between runs

      - name: Run unit tests
        run: .\mvnw.cmd clean test -DskipTests=false

      - name: Install WiX Toolset 3.x (required by jpackage --type msi)
        # jpackage discovers WiX automatically in
        # "C:\Program Files (x86)\WiX Toolset v3.14\bin" (choco installs it there),
        # so no WIX env var / PATH tweaking is needed.
        run: choco install wixtoolset -y --no-progress

      - name: Build .msi installer
        # build-msi.ps1 runs `mvn clean package` itself (downloads JavaFX win-jars
        # into the local m2 cache), then assembles thin-jar + app/*, jlink runtime
        # image and finally jpackage --type msi. Result: target/dist/KP IMDB Importer-<ver>.msi
        run: powershell -ExecutionPolicy Bypass -File build-msi.ps1 -Msi

      - name: Resolve project version from pom.xml
        id: version
        shell: pwsh
        run: |
          # Parse the <version> directly under <project> (NOT the parent's version).
          [xml]$pom = Get-Content -Path "pom.xml" -Raw
          $v = $pom.project.version.Trim()
          Write-Host "Resolved project version: $v"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v"

      - name: Locate built .msi
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "target\dist" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No .msi found under target\dist" }
          Write-Host "MSI: $($msi.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$($msi.FullName)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$($msi.Name)"

      - name: Upload .msi as build artifact (always kept)
        uses: actions/upload-artifact@v4
        with:
          name: KP-IMDB-Importer-${{ steps.version.outputs.version }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error

      # ---- Variant B: publish to GitHub Release ONLY if the pom version differs
      # ---- from the latest published release tag. Otherwise leave Releases untouched.
      - name: Decide whether to publish a new Release
        id: decide
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $current = "${{ steps.version.outputs.version }}"

          $latest = $null
          $releaseList = gh release list --limit 1 --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $releaseList) {
            $latest = ($releaseList | ConvertFrom-Json)[0].tagName
          }

          Write-Host "Current pom version : $current"
          Write-Host "Latest release tag : $($latest ?? '(none)')"

          # First release ever -> publish. Otherwise publish only if versions differ.
          $shouldPublish = $false
          if (-not $latest) {
            $shouldPublish = $true
          } elseif ($latest -ne $current) {
            $shouldPublish = $true
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "publish=$shouldPublish"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "latest=$latest"
          Write-Host "should_publish: $shouldPublish"

      - name: Create or update GitHub Release
        if: steps.decide.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.version }}"
          $msiPath = "${{ steps.msi.outputs.path }}"

          # Re-check whether a release with this tag already exists (idempotency).
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Release '$tag' already exists - updating assets."
            gh release upload $tag $msiPath --clobber
          } else {
            Write-Host "Creating release '$tag'."
            gh release create $tag $msiPath `
              --title "KP IMDB Importer $tag" `
              --notes "Automated build from GitHub Actions. Download the .msi installer below."
          }
